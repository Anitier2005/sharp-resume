[package]
name = "sharp-resume"
version = "0.1.0"
description = "Sharp Resume · AI 简历工作台"
authors = ["Anitier"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sharp_resume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：把 dist/ 以 tauri:// 自定义协议内嵌进二进制。
# 缺了它，release 版会去连 devUrl（localhost:1420），窗口只剩白屏。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 读取 Windows「辅助功能 → 文本大小」的实际缩放值，供 UI 字号跟随。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
