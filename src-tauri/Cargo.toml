[package]
name = "sharp-resume"
version = "0.1.0"
description = "Sharp Resume · AI 简历工作台"
authors = ["Anitier"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sharp_resume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：把 dist/ 以 tauri:// 自定义协议内嵌进二进制。
# 缺了它，release 版会去连 devUrl（localhost:1420），窗口只剩白屏。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 通讯层：自己持有 reqwest，而不是让前端 fetch（WebView 会撞 CORS）。
# 关键取舍——关掉默认特性，TLS 走系统 Schannel（native-tls）：
#   默认的 rustls 会拉 aws-lc-sys / ring，那是 C + 汇编，要 CMake/NASM，
#   本机编不过。native-tls 只调系统 DLL，零 C 构建。
# system-proxy：读 WinINET 设置，Clash / 公司代理下才连得出去。
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "native-tls",
  "system-proxy",
] }
futures-util = "0.3"

# 读取 Windows「辅助功能 → 文本大小」的实际缩放值，供 UI 字号跟随。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# 测试里用 #[tokio::test] 真连一次模型：tokio 本来就在树里，加 feature 不增编译量。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
