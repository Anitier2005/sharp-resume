[package]
name = "sharp-resume"
version = "0.1.0"
description = "Sharp Resume · AI 简历工作台"
authors = ["Anitier"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sharp_resume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
