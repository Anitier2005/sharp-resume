[package]
name = "sharp-resume"
version = "0.1.0"
description = "Sharp Resume · AI 简历工作台"
authors = ["Anitier"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sharp_resume_lib"
# 只要 rlib。Tauri 模板默认给三种形态是为了移动端：iOS 要 staticlib，
# Android 要 cdylib，桌面只用 rlib。三种形态会把同一个库编三遍，
# 其中 staticlib 还要额外产出一个 300+ MB 的 .lib，链接时间翻倍。
# 本项目只做 Windows 桌面，砍掉另外两种，debug 编译快一大截。
crate-type = ["rlib"]

[features]
# 生产构建必须启用：把 dist/ 以 tauri:// 自定义协议内嵌进二进制。
# 缺了它，release 版会去连 devUrl（localhost:1420），窗口只剩白屏。
custom-protocol = ["tauri/custom-protocol"]
# 进程内 OCR（tesseract）。默认不启用：资源（DLL + 语言包）共 ~13MB 会嵌进 exe；
# 不启用时图片转文字走设置里的 OCR 接口。
# 带 OCR 的构建：.tools\build-ocr.bat（--features ocr,custom-protocol）。
# 资源在运行时释放并用 LoadLibrary 动态加载，所以**不再需要** tesseract-sys /
# 导入库 / bindgen / libclang —— 构建只要 MSVC 链接器。
ocr = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 只为构建期校验知识库清单：清单写坏时不该让运行时静默变成「空库」
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 通讯层：自己持有 reqwest，而不是让前端 fetch（WebView 会撞 CORS）。
# 关键取舍——关掉默认特性，TLS 走系统 Schannel（native-tls）：
#   默认的 rustls 会拉 aws-lc-sys / ring，那是 C + 汇编，要 CMake/NASM，
#   本机编不过。native-tls 只调系统 DLL，零 C 构建。
# system-proxy：读 WinINET 设置，Clash / 公司代理下才连得出去。
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "native-tls",
  "system-proxy",
  # 知识库检索的工具路径是同步 fn（工具表不区分 async），算 query 向量
  # 要在工具里发 HTTP —— 用 blocking client，不为这个改整个工具层的签名
  "blocking",
] }
futures-util = "0.3"

# 结构化数据的权威存储。
# bundled：把 sqlite3.c 一起编进来，不依赖系统里的 libsqlite3
# （Windows 只有 System32 的 winsqlite3.dll，版本和特性都不受控）。
# 已验证：MSVC Community 2026 + 本机 SDK 能编过（sqlite 3.46.0）。
rusqlite = { version = "0.32", features = ["bundled"] }

# 成品层的 HTML 清洗：模型产出的字符串不能直接进 WebView。
# 依赖链里已经有一份 html5ever（dom_query 带进来的），这里只是多一层白名单策略。
ammonia = "4"

# 图片转化：限尺寸、转格式、按比例裁剪。
# 纯 Rust，没有 C 依赖（png / jpeg / webp 都是 Rust 实现），
# 关掉默认特性只为少编几个用不上的编解码器（tiff / exr / hdr）。
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }

# 附件 PDF 的文本提取。纯 Rust（lopdf 系），无 C 依赖。
pdf-extract = "0.7"

# PDF 里的内嵌位图抽取（XObject 遍历、流解码）。显式声明只是为了能 use lopdf::：
# 它本来就在树里（pdf-extract 的传递依赖，lock 里已锁 0.34.0），所以不动版本。
# 必须关默认特性：lopdf 的 default = chrono_time + nom_parser + rayon，
# 而 pdf-extract 只开 nom_parser —— 打开默认特性会额外拉进 rayon / crossbeam / chrono
# 六个包（lock 多 48 行），白增编译量。
# 显式声明 nom_parser：`content::Content::decode` 与本模块的 `Document::load_mem`
# 都在它后面，别依赖 pdf-extract 的传递 feature（那个开关一改我们就编译不过）。
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }

# OCR 接口通道要把图片拼成 data URL，需要 base64。纯 Rust，无 C 依赖。
base64 = "0.22"
# 带格式解析 docx/pptx/xlsx 用：解压 + XML。
# 两者本来就在依赖树里（flate2 由 png/reqwest 带进来，quick-xml 由 tauri 带进来），
# 显式声明只是为了能 use；版本按 Cargo.lock 里已锁的那份写，不新增编译单元。
flate2 = "1"
quick-xml = "0.42"


# NFKC：排版文字锁要比对「模型手写 HTML 的纯文本」与「结构化内容的纯文本」。
# 全角字母、康熙部首、带圈数字这些视觉相同的字符必须归一到同一个码位，
# 否则模型用全角括号排版本、结构化内容是半角，锁会误伤一次正当的排版。
# 本来就在依赖树里（url/idna 带进来的），显式声明只为能 use。
unicode-normalization = "0.1"


# 读取 Windows「辅助功能 → 文本大小」的实际缩放值，供 UI 字号跟随。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Windows.Data.Pdf：把 PDF 页面渲染成图片（视觉模型看图用）。
# 为什么用系统自带而不是 pdfium / mupdf：那两个要额外带 10MB+ 二进制或 cmake 整包编译，
# 而 Win10+ 本来就有 PDF 渲染器 —— 这是我们唯一不增体积的选择。
windows = { version = "0.62", features = [
  "Foundation",
  "Storage_Streams",
  "Data_Pdf",
  # RoInitialize：聊天跑在 tokio 工作线程上，那里没人替我们初始化 COM/WinRT
  "Win32_System_WinRT",
] }

# 测试里用 #[tokio::test] 真连一次模型：tokio 本来就在树里，加 feature 不增编译量。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# 开发档只保留行号表，不要完整 debuginfo。
# 起因：`cargo test --lib` 每次链接出的测试二进制带着完整调试信息，几百 MB 一份、
# 按 hash 不共享；几个人并发跑就把磁盘吃满（真出现过 477G 盘写满、rlib 被截断）。
# debug = 1 保留「出错时能看到行号」，砍掉变量与类型信息 —— 体积降一半以上，
# 断点调试依然可用。要做内存级调试时临时改成 2，不要长期开着。
[profile.dev]
debug = 1
